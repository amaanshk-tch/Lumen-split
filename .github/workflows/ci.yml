name: LumenSplit Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Run contract tests
        run: cargo test --package lumen_split

      - name: Build Soroban contract
        run: cargo build --package lumen_split --target wasm32-unknown-unknown --release


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
